name: Template Validation
on:
  pull_request_target:
    branches:
      - main

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Validate template
        id: validate-template
        uses: ./.github/actions/validate-template
        with:
          path: $GITHUB_WORKSPACE

      - name: Create comment
        if: ${{ steps.validate-template.outputs.status != 0 && !github.event.pull_request.head.repo.fork }}
        uses: peter-evans/create-or-update-comment@a35cf36e5301d70b76f316e867e7788a55a31dae # v1.4.5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.validate-template.outputs.detail }}
