name: Template Validation
on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Validate template
        id: validate-template
        uses: ./.github/actions/validate-template
        with:
          path: ${{ github.workspace }}

      - name: Report validation result
        env:
          VALIDATION_STATUS: ${{ steps.validate-template.outputs.status }}
          VALIDATION_DETAIL: ${{ steps.validate-template.outputs.detail }}
        shell: bash
        run: |
          printf '## Template validation\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$VALIDATION_STATUS" = "0" ]; then
            printf 'All templates passed validation.\n' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$VALIDATION_STATUS" = "1" ]; then
            printf '%s\n' "$VALIDATION_DETAIL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Template validator returned an unexpected status."
            exit 1
          fi
